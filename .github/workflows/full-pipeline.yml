name: Jawal Full 10-Stage Pipeline

on:
  workflow_dispatch:
    inputs:
      native_bridge:
        description: "ARM native bridge: none or libndk"
        required: true
        default: "none"
        type: choice
        options: [none, libndk]
      qemu_dir:
        description: "QEMU Windows runtime directory on the Windows builder"
        required: true
        default: "C:\\Program Files\\qemu"
        type: string
      makensis:
        description: "Full path to makensis.exe on Windows builders"
        required: true
        default: "C:\\Program Files (x86)\\NSIS\\makensis.exe"
        type: string
      apk_corpus_dir:
        description: "Directory of legal test APKs on the hardware runner for stage 6"
        required: true
        default: "C:\\JawalTest\\apk-corpus"
        type: string
      arm64_smoke_apk:
        description: "ARM64-only smoke APK path on the hardware runner (used when native_bridge=libndk)"
        required: true
        default: "C:\\JawalTest\\arm64-smoke.apk"
        type: string

concurrency:
  group: jawal-full-pipeline
  cancel-in-progress: false

jobs:
  stage-1-and-2-jawalos:
    name: "1 Build JawalOS + 2 size/runtime gate"
    runs-on: [self-hosted, Linux, X64, jawal-android-builder]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Stage 1 - verify Android builder capacity
        run: |
          chmod +x tools/check-android-builder.sh android/scripts/*.sh tools/*.sh
          tools/check-android-builder.sh

      - name: Stage 1 - build stripped Android 15 QPR2 JawalOS
        env:
          JAWAL_NATIVE_BRIDGE: ${{ inputs.native_bridge }}
          JAWAL_BUILD_TYPE: user
          JAWAL_SERVICES_VARIANT: microg
          JAWAL_STRICT_SIZE: "1"
        run: android/scripts/sync-and-build.sh

      - name: Stage 2 - package immutable system + sparse data template
        run: android/scripts/package-runtime.sh dist/android/jawal-android.iso dist/android-runtime

      - name: Stage 2 - publish measured size evidence
        run: |
          echo "### JawalOS measured artifacts" >> "$GITHUB_STEP_SUMMARY"
          cat dist/android/image-size.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/android/jawal-android.iso dist/android-runtime/images/*.qcow2 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JawalOS runtime
        uses: actions/upload-artifact@v4
        with:
          name: jawalos-runtime
          compression-level: 0
          retention-days: 7
          path: |
            dist/android-runtime/**
            dist/android/JawalSmokeApp.apk
            dist/android/validation.txt
            dist/android/largest-files.tsv
            dist/android/build-metadata.txt
            dist/android/image-size.txt

  stage-3-package:
    name: "3 Assemble Windows runtime + JawalSetup"
    needs: stage-1-and-2-jawalos
    runs-on: [self-hosted, Windows, X64, jawal-windows-builder]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jawalos-runtime
          path: dist

      - name: Build Jawal Windows binaries Release
        shell: pwsh
        run: |
          cmake -S host -B build/host -G "Visual Studio 17 2022" -A x64
          cmake --build build/host --config Release --parallel

      - name: Assemble QEMU + JawalOS runtime
        shell: pwsh
        run: |
          ./packaging/assemble-windows-runtime.ps1 -QemuDir '${{ inputs.qemu_dir }}' -AndroidRuntimeDir 'dist/android-runtime' -OutputDir 'dist/runtime'
          ./packaging/verify-runtime.ps1 -RuntimeDir 'dist/runtime'

      - name: Assemble portable test layout
        shell: pwsh
        run: |
          New-Item dist/portable -ItemType Directory -Force | Out-Null
          Copy-Item build/host/Release/Jawal.exe dist/portable/Jawal.exe -Force
          Copy-Item build/host/Release/JawalPkg.exe dist/portable/JawalPkg.exe -Force
          Copy-Item dist/runtime dist/portable/runtime -Recurse -Force

      - name: Build single-file installer candidate
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Makensis '${{ inputs.makensis }}'

      - name: Record installer size
        shell: pwsh
        run: |
          $size = [Math]::Round((Get-Item dist/JawalSetup.exe).Length / 1MB, 1)
          "### Stage 3`nJawalSetup.exe candidate: **$size MiB**" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload packaged Jawal
        uses: actions/upload-artifact@v4
        with:
          name: jawal-windows-package
          compression-level: 0
          retention-days: 7
          path: |
            dist/JawalSetup.exe
            dist/portable/**
            dist/android/JawalSmokeApp.apk
            dist/reports/**

  stage-4-runtime:
    name: "4 WHPX boot/performance smoke"
    needs: stage-3-package
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Boot Android and measure runtime
        shell: pwsh
        run: ./tools/windows-runtime-smoke.ps1 -JawalExe 'dist/portable/Jawal.exe' -TimeoutSeconds 180

      - name: Upload runtime report
        uses: actions/upload-artifact@v4
        with:
          name: jawal-stage4-report
          path: dist/reports/windows-runtime-smoke.json

  stage-5-functional:
    name: "5 Android services + APK install smoke"
    needs: stage-4-runtime
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Validate WebView/network/audio/phone/storage and PackageInstaller
        shell: pwsh
        run: |
          ./tools/windows-functional-smoke.ps1 `
            -JawalExe 'dist/portable/Jawal.exe' `
            -SmokeApk 'dist/android/JawalSmokeApp.apk' `
            -TimeoutSeconds 180

      - name: Upload functional report
        uses: actions/upload-artifact@v4
        with:
          name: jawal-stage5-report
          path: dist/reports/windows-functional-smoke.json

  stage-6-apk-matrix:
    name: "6 APK compatibility matrix"
    needs: stage-5-functional
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Run APK install matrix through the production package bridge
        shell: pwsh
        run: |
          ./tools/windows-apk-matrix.ps1 `
            -JawalExe 'dist/portable/Jawal.exe' `
            -JawalPkgExe 'dist/portable/JawalPkg.exe' `
            -ApkDirectory '${{ inputs.apk_corpus_dir }}' `
            -MinimumPassRate 0.90 `
            -TimeoutSeconds 240

      - uses: actions/upload-artifact@v4
        with:
          name: jawal-stage6-apk-matrix
          path: dist/reports/apk-matrix.json

  stage-7-arm64:
    name: "7 ARM64 native-bridge gate"
    needs: stage-6-apk-matrix
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: ARM64 bridge not requested
        if: ${{ inputs.native_bridge != 'libndk' }}
        shell: pwsh
        run: |
          New-Item dist/reports -ItemType Directory -Force | Out-Null
          '{"passed":true,"skipped":true,"reason":"native_bridge=none"}' | Set-Content dist/reports/arm64-smoke.json -Encoding UTF8

      - name: Validate active native bridge and install ARM64-only APK
        if: ${{ inputs.native_bridge == 'libndk' }}
        shell: pwsh
        run: |
          ./tools/windows-arm64-smoke.ps1 `
            -JawalExe 'dist/portable/Jawal.exe' `
            -JawalPkgExe 'dist/portable/JawalPkg.exe' `
            -Arm64Apk '${{ inputs.arm64_smoke_apk }}' `
            -TimeoutSeconds 240

      - uses: actions/upload-artifact@v4
        with:
          name: jawal-stage7-arm64
          path: dist/reports/arm64-smoke.json

  stage-8-factory-reset:
    name: "8 Factory reset clean-device lifecycle"
    needs: stage-7-arm64
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 30
    env:
      JAWAL_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Install smoke app, recreate user data, verify clean guest
        shell: pwsh
        run: |
          ./tools/windows-factory-reset-smoke.ps1 `
            -JawalExe 'dist/portable/Jawal.exe' `
            -JawalPkgExe 'dist/portable/JawalPkg.exe' `
            -SmokeApk 'dist/android/JawalSmokeApp.apk' `
            -TimeoutSeconds 240

      - uses: actions/upload-artifact@v4
        with:
          name: jawal-stage8-factory-reset
          path: dist/reports/factory-reset-smoke.json

  stage-9-resilience:
    name: "9 Forced-stop and data-integrity recovery"
    needs: stage-8-factory-reset
    runs-on: [self-hosted, Windows, X64, jawal-windows-hw]
    timeout-minutes: 45
    env:
      JAWAL_DESTRUCTIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Force-stop QEMU, check qcow2, reboot and verify data three times
        shell: pwsh
        run: |
          ./tools/windows-resilience-smoke.ps1 `
            -JawalExe 'dist/portable/Jawal.exe' `
            -JawalPkgExe 'dist/portable/JawalPkg.exe' `
            -SmokeApk 'dist/android/JawalSmokeApp.apk' `
            -Cycles 3 `
            -TimeoutSeconds 240

      - uses: actions/upload-artifact@v4
        with:
          name: jawal-stage9-resilience
          path: dist/reports/resilience-smoke.json

  stage-10-release:
    name: "10 Signed Release + final size/hash gate"
    needs: stage-9-resilience
    runs-on: [self-hosted, Windows, X64, jawal-windows-release]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jawal-windows-package
          path: dist

      - name: Reconstruct packaging layout
        shell: pwsh
        run: |
          New-Item build/host/Release -ItemType Directory -Force | Out-Null
          Copy-Item dist/portable/Jawal.exe build/host/Release/Jawal.exe -Force
          if (Test-Path dist/runtime) { Remove-Item dist/runtime -Recurse -Force }
          Copy-Item dist/portable/runtime dist/runtime -Recurse -Force

      - name: Sign Jawal.exe before embedding it in the installer
        shell: pwsh
        run: |
          ./packaging/sign-release.ps1 `
            -Paths @('build/host/Release/Jawal.exe') `
            -CertificateThumbprint $env:JAWAL_SIGNING_CERT_THUMBPRINT `
            -RequireSigning

      - name: Build installer with signed Jawal.exe
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Makensis '${{ inputs.makensis }}'

      - name: Sign final JawalSetup.exe
        shell: pwsh
        run: |
          ./packaging/sign-release.ps1 `
            -Paths @('dist/JawalSetup.exe') `
            -CertificateThumbprint $env:JAWAL_SIGNING_CERT_THUMBPRINT `
            -RequireSigning

      - name: Enforce final size, Authenticode and SHA-256 gates
        shell: pwsh
        run: |
          ./packaging/release-gate.ps1 `
            -Installer 'dist/JawalSetup.exe' `
            -JawalExe 'build/host/Release/Jawal.exe' `
            -RuntimeDir 'dist/runtime' `
            -MaxInstallerMiB 1200 `
            -MaxInstalledMiB 3072 `
            -RequireSignature

      - name: Upload final signed release
        uses: actions/upload-artifact@v4
        with:
          name: jawal-signed-release
          compression-level: 0
          retention-days: 30
          path: |
            dist/JawalSetup.exe
            dist/SHA256SUMS.txt
            dist/reports/release-gate.json
