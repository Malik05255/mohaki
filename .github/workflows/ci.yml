name: Jawal CI

on:
  push:
    branches: [main, jawal-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-host:
    # Pin the runner because windows-latest has moved to a VS 2026 image, while
    # this workflow deliberately uses the widely deployed VS 2022 toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('packaging/assemble-windows-runtime.ps1', 'packaging/build-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Configure Jawal host
        run: cmake -S host -B build/host -G "Visual Studio 17 2022" -A x64
      - name: Build Jawal host
        run: cmake --build build/host --config Release --parallel
      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: jawal-host-windows-x64
          path: build/host/Release/Jawal.exe

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse shell build scripts
        run: |
          bash -n android/scripts/sync-and-build.sh
          bash -n android/scripts/package-runtime.sh
          bash -n tools/fetch-store.sh
          bash -n tools/validate-product.sh
