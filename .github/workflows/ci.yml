name: Jawal CI

on:
  push:
    branches: [main, jawal-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-host:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell packaging and smoke scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'packaging/assemble-windows-runtime.ps1',
            'packaging/build-installer.ps1',
            'packaging/verify-runtime.ps1',
            'packaging/sign-release.ps1',
            'packaging/release-gate.ps1',
            'tools/probe-guest.ps1',
            'tools/install-smoke-apk.ps1',
            'tools/windows-runtime-smoke.ps1',
            'tools/windows-gpu-smoke.ps1',
            'tools/windows-quick-resume-smoke.ps1',
            'tools/windows-functional-smoke.ps1',
            'tools/windows-apk-matrix.ps1',
            'tools/windows-arm64-smoke.ps1',
            'tools/windows-factory-reset-smoke.ps1',
            'tools/windows-resilience-smoke.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Configure Jawal host
        run: cmake -S host -B build/host -G "Visual Studio 17 2022" -A x64
      - name: Build Jawal host
        run: cmake --build build/host --config Release --parallel
      - name: Exercise PE dependency scanner on built Windows binaries
        shell: pwsh
        run: |
          python tools/pe-dependency-closure.py build/host/Release Jawal.exe JawalPkg.exe --json build/host/pe-smoke.json
          if (-not (Test-Path build/host/pe-smoke.json)) { throw 'PE dependency scanner did not emit its report.' }
          Get-Content build/host/pe-smoke.json
      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: jawal-host-windows-x64
          path: |
            build/host/Release/Jawal.exe
            build/host/Release/JawalPkg.exe
            build/host/pe-smoke.json

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse shell and Python build tooling
        run: |
          bash -n android/scripts/sync-and-build.sh
          bash -n android/scripts/package-runtime.sh
          bash -n tools/check-android-builder.sh
          bash -n tools/fetch-store.sh
          bash -n tools/validate-product.sh
          bash -n tools/build-arm64-smoke.sh
          python3 -m py_compile tools/analyze-jawalos-size.py
          python3 -m py_compile tools/pe-dependency-closure.py
